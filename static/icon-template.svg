<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Background -->
    <rect x="0" y="0" width="512" height="512" rx="100" fill="#121212"/>
    
    <!-- Remote Body -->
    <rect x="136" y="80" width="240" height="352" rx="40" fill="#2C2C2C"/>
    
    <!-- Power Button -->
    <circle cx="256" cy="130" r="24" fill="#FF4444"/>
    
    <!-- D-Pad Outer -->
    <circle cx="256" cy="230" r="70" fill="#3A3A3A"/>
    
    <!-- D-Pad Directions -->
    <rect x="246" y="180" width="20" height="30" rx="4" fill="#FFFFFF"/> <!-- Up -->
    <rect x="246" y="250" width="20" height="30" rx="4" fill="#FFFFFF"/> <!-- Down -->
    <rect x="216" y="220" width="30" height="20" rx="4" fill="#FFFFFF"/> <!-- Left -->
    <rect x="266" y="220" width="30" height="20" rx="4" fill="#FFFFFF"/> <!-- Right -->
    
    <!-- Center Button -->
    <circle cx="256" cy="230" r="20" fill="#555555" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Volume / Channel Buttons -->
    <!-- Volume (Left) -->
    <rect x="180" y="310" width="40" height="80" rx="20" fill="#3A3A3A"/>
    <rect x="190" y="320" width="20" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="190" y="350" width="20" height="20" rx="4" fill="#FFFFFF"/>
    
    <!-- Channel (Right) -->
    <rect x="300" y="310" width="40" height="80" rx="20" fill="#3A3A3A"/>
    <rect x="310" y="320" width="20" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="310" y="350" width="20" height="20" rx="4" fill="#FFFFFF"/>
</svg>
